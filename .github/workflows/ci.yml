name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Firestore and Storage security rules, tested against the Firebase emulators (which need Java).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm run test:rules
      # supabase/seed.sql is generated from the catalogue; fail if someone changed products.ts without regenerating it.
      - name: Check the database seed is up to date
        run: npm run db:seed:generate && git diff --exit-code supabase/seed.sql
      # The build generates Next's route types (PageProps, LayoutProps), so type-check after it.
      - run: npm run build
      - run: npx tsc --noEmit
